[project]
site_name = "bearshape"
site_url = "https://acecchini.github.io/bearshape/"
site_description = "Elegant runtime shape and dtype checking for NumPy, JAX, PyTorch, and CuPy arrays — powered by beartype."
site_author = "acecchini"
copyright = "Copyright &copy; 2025 – 2026 bearshape contributors"
repo_url = "https://github.com/acecchini/bearshape"
repo_name = "acecchini/bearshape"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/extra.css?v=17"]
extra_javascript = ["assets/js/tesseract.js?v=11"]

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    "getting-started/index.md",
    "getting-started/installation.md",
    "getting-started/quickstart.md",
  ]},
  { "Features" = [
    "features/index.md",
    "features/dimensions.md",
    "features/static-typing.md",
    "features/frameworks.md",
    "features/array-types.md",
    "features/like-types.md",
    "features/tree-annotations.md",
    "features/decorator.md",
    "features/claw.md",
  ]},
  { "API Reference" = [
    "api/index.md",
    "api/bearshape.md",
    "api/numpy.md",
    "api/jax.md",
    "api/torch.md",
    "api/cupy.md",
    "api/optree.md",
    "api/claw.md",
  ]},
  { "Examples" = [
    "examples/index.md",
  ]},
  { "Maintainers" = [
    "maintainers/production-readiness.md",
  ]},
]

[project.theme]
variant = "classic"
custom_dir = "docs/overrides"
language = "en"
favicon = "assets/logo.svg"
logo = "assets/logo.svg"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.path",
  "navigation.indexes",
  "navigation.top",
  "navigation.footer",
  "toc.follow",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "content.footnote.tooltips",
  "search.highlight",
  "header.autohide",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[project.theme.icon]
repo = "fontawesome/brands/github"
edit = "material/pencil"
view = "material/eye"

# Light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep purple"
accent = "deep purple"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to dark mode"

# Dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep purple"
accent = "deep purple"
toggle.icon = "material/weather-night"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/acecchini/bearshape"
